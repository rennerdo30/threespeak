<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" font-family="Open Sans, Segoe UI, Noto Sans, sans-serif" font-size="14">
  <title>Threespeak {{VARIANT}}</title>
  <!-- window -->
  <rect width="1024" height="768" fill="{{ground}}"/>
  <!-- header bar -->
  <rect width="1024" height="48" fill="{{chrome}}"/>
  <line x1="0" y1="48.5" x2="1024" y2="48.5" stroke="{{border}}"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="{{accent}}">teamspeak</text>
  <rect x="300" y="12" width="132" height="24" rx="3" fill="{{ground}}" stroke="{{border}}"/>
  <text x="314" y="29" font-size="11" fill="{{muted}}">AFK</text>
  <line x1="350" y1="17" x2="350" y2="31" stroke="{{border}}"/>
  <circle cx="372" cy="24" r="5" fill="none" stroke="{{text}}" stroke-width="1.5"/>
  <path d="M396 19 l6 5 l-6 5 z" fill="{{text}}"/>
  <text x="944" y="30" font-size="14" fill="{{muted}}">–</text>
  <text x="970" y="30" font-size="14" fill="{{muted}}">☐</text>
  <text x="998" y="30" font-size="14" fill="{{muted}}">✕</text>

  <!-- sidebar -->
  <rect x="0" y="49" width="240" height="719" fill="{{chrome}}"/>
  <line x1="240.5" y1="49" x2="240.5" y2="768" stroke="{{border}}"/>
  <rect x="12" y="62" width="216" height="26" rx="3" fill="{{ground}}" stroke="{{border}}"/>
  <text x="22" y="80" fill="{{muted}}" font-size="13">Search / Connect</text>
  <text x="12" y="116" font-size="12" font-weight="700" fill="{{muted}}" letter-spacing="0.3">SERVERS</text>
  <rect x="8" y="126" width="224" height="26" rx="3" fill="{{selection}}"/>
  <rect x="8" y="126" width="2" height="26" fill="{{accent}}"/>
  <circle cx="24" cy="139" r="4" fill="{{online}}"/>
  <text x="38" y="144" font-size="13" fill="{{text}}">renner.dev</text>
  <text x="212" y="144" font-size="13" fill="{{muted}}">✕</text>
  <text x="12" y="188" font-size="12" font-weight="700" fill="{{muted}}" letter-spacing="0.3">BOOKMARKS</text>
  <text x="24" y="214" font-size="13" fill="{{text}}">renner.dev</text>
  <text x="12" y="256" font-size="12" font-weight="700" fill="{{muted}}" letter-spacing="0.3">CONTACTS</text>
  <text x="24" y="282" font-size="13" fill="{{accent}}">Add contact</text>
  <text x="24" y="304" font-size="13" fill="{{muted}}">No contacts</text>
  <text x="12" y="346" font-size="12" font-weight="700" fill="{{muted}}" letter-spacing="0.3">GROUP CHATS</text>
  <text x="24" y="372" font-size="13" fill="{{accent}}">Join group chat</text>
  <text x="24" y="394" font-size="13" fill="{{muted}}">No chats</text>
  <line x1="0" y1="727.5" x2="240" y2="727.5" stroke="{{border}}"/>
  <circle cx="24" cy="748" r="8" fill="{{raised}}" stroke="{{border}}"/>
  <circle cx="30" cy="754" r="3.5" fill="{{online}}" stroke="{{chrome}}"/>
  <text x="42" y="753" font-size="13" fill="{{text}}">Rennerdo30</text>
  <text x="212" y="753" font-size="13" fill="{{muted}}">⚙</text>

  <!-- tree column -->
  <rect x="241" y="49" width="380" height="719" fill="{{ground}}"/>
  <line x1="621.5" y1="49" x2="621.5" y2="768" stroke="{{border}}"/>
  <rect x="249" y="58" width="364" height="36" rx="3" fill="{{chrome}}" stroke="{{border}}"/>
  <path d="M263 66 l9 5 v10 l-9 5 l-9 -5 v-10 z" fill="{{accent}}"/>
  <text x="282" y="81" font-size="13" font-weight="600" fill="{{text}}">renner.dev</text>
  <text x="572" y="81" font-size="13" fill="{{muted}}">☆   ✎</text>

  <g font-size="13" fill="{{text}}">
    <path d="M265 111 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{accent}}" opacity="0.85"/>
    <text x="284" y="122">Default Channel</text>

    <rect x="249" y="134" width="364" height="24" rx="3" fill="{{hover}}"/>
    <text x="256" y="151" fill="{{muted}}">⌄</text>
    <path d="M275 135 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{accent}}" opacity="0.85"/>
    <text x="294" y="151" font-weight="600">Renners Reich</text>
    <circle cx="296" cy="170" r="6" fill="{{silent}}" stroke="{{accent}}" stroke-width="1"/>
    <text x="310" y="175">renner1</text>
    <rect x="586" y="163" width="14" height="14" rx="2" fill="{{raised}}" stroke="{{border}}"/>

    <path d="M265 187 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{accent}}" opacity="0.85"/>
    <text x="284" y="198">korixn</text>

    <rect x="249" y="206" width="364" height="24" rx="3" fill="{{selection}}"/>
    <rect x="249" y="206" width="2" height="24" fill="{{accent}}"/>
    <text x="256" y="223" fill="{{muted}}">⌄</text>
    <path d="M275 207 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{accent}}" opacity="0.85"/>
    <text x="294" y="223" font-weight="600">etix</text>
    <circle cx="296" cy="242" r="6" fill="{{talking}}" stroke="{{accent}}" stroke-width="1"/>
    <text x="310" y="247" font-weight="600">renner</text>
    <rect x="586" y="235" width="14" height="14" rx="2" fill="{{raised}}" stroke="{{border}}"/>
    <circle cx="296" cy="266" r="6" fill="{{silent}}" stroke="{{accent}}" stroke-width="1"/>
    <text x="310" y="271">Tipange</text>
    <circle cx="296" cy="290" r="6" fill="{{silent}}" stroke="{{accent}}" stroke-width="1"/>
    <text x="310" y="295">Wildleder</text>

    <path d="M265 303 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{accent}}" opacity="0.85"/>
    <text x="284" y="314">bodi kekw</text>
    <path d="M265 327 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{away}}" opacity="0.9"/>
    <text x="284" y="338">Chris cornona club</text>
    <text x="596" y="338" fill="{{muted}}">🔒</text>
    <path d="M265 351 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{accent}}" opacity="0.85"/>
    <text x="284" y="362">Timons Taverne</text>
    <path d="M265 375 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{accent}}" opacity="0.85"/>
    <text x="284" y="386">Homeoffice</text>
    <path d="M265 399 l7 4 v7 l-7 4 l-7 -4 v-7 z" fill="{{accent}}" opacity="0.85"/>
    <text x="284" y="410">AFK</text>
  </g>
  <line x1="241" y1="727.5" x2="621" y2="727.5" stroke="{{border}}"/>
  <rect x="249" y="736" width="118" height="24" rx="3" fill="{{accent}}"/>
  <text x="264" y="753" font-size="12" font-weight="600" fill="#ffffff">+  Create channel</text>

  <!-- content pane -->
  <rect x="622" y="49" width="402" height="719" fill="{{ground}}"/>
  <path d="M645 66 l10 6 v12 l-10 6 l-10 -6 v-12 z" fill="{{accent}}"/>
  <text x="666" y="86" font-size="20" font-weight="600" fill="{{text}}">renner.dev</text>
  <text x="958" y="84" font-size="13" fill="{{muted}}">✎  ⓘ  ▤</text>
  <line x1="622" y1="104.5" x2="1024" y2="104.5" stroke="{{border}}"/>

  <rect x="638" y="120" width="370" height="40" rx="4" fill="{{chrome}}" stroke="{{border}}"/>
  <text x="652" y="145" font-size="13" fill="{{text}}">Welcome to TeamSpeak, check <tspan fill="{{accent}}">www.teamspeak.com</tspan></text>

  <rect x="638" y="176" width="180" height="150" rx="4" fill="{{ground}}" stroke="{{border}}"/>
  <text x="652" y="198" font-size="13" font-weight="700" fill="{{text}}">Server</text>
  <g font-size="13">
    <text x="652" y="224" fill="{{muted}}">Address</text><text x="730" y="224" fill="{{text}}">renner.dev</text>
    <text x="652" y="246" fill="{{muted}}">Version</text><text x="730" y="246" fill="{{text}}">3.13.7 · Linux</text>
    <text x="652" y="268" fill="{{muted}}">Uptime</text><text x="730" y="268" fill="{{text}}">7 months</text>
    <text x="652" y="290" fill="{{muted}}">Clients</text><text x="730" y="290" fill="{{text}}">4 / 32</text>
    <text x="652" y="312" fill="{{muted}}">Channels</text><text x="730" y="312" fill="{{text}}">9</text>
  </g>

  <rect x="828" y="176" width="180" height="150" rx="4" fill="{{ground}}" stroke="{{border}}"/>
  <text x="842" y="198" font-size="13" font-weight="700" fill="{{text}}">Manage</text>
  <g font-size="13" fill="{{accent}}">
    <text x="842" y="224">Permissions</text>
    <text x="842" y="246">Banned users</text>
    <text x="842" y="268">Privilege keys</text>
    <text x="842" y="290">Temporary passwords</text>
    <text x="842" y="312">Client list</text>
  </g>

  <!-- chat log -->
  <rect x="638" y="342" width="370" height="330" rx="4" fill="{{ground}}" stroke="{{border}}"/>
  <text x="652" y="364" font-size="13" font-weight="700" fill="{{text}}">Chat</text>
  <line x1="639" y1="374.5" x2="1007" y2="374.5" stroke="{{border}}"/>
  <g font-size="12">
    <text x="652" y="396" fill="{{muted}}">17:37:49</text><text x="716" y="396" fill="{{text}}"><tspan font-weight="600">renner</tspan>  <tspan fill="{{accent}}">https://store.steampowered.com/app/…</tspan></text>
    <text x="652" y="418" fill="{{muted}}">17:37:56</text><text x="716" y="418" fill="{{muted}}">You are now talking in <tspan font-weight="600" fill="{{text}}">etix</tspan></text>
    <text x="652" y="440" fill="{{muted}}">18:25:01</text><text x="716" y="440" fill="{{text}}"><tspan font-weight="600">renner</tspan>  <tspan fill="{{accent}}">https://w2g.renner.dev/room/04lq9o</tspan></text>
    <text x="652" y="462" fill="{{muted}}">18:25:27</text><text x="716" y="462" fill="{{text}}"><tspan font-weight="600">Tipange</tspan>  sounds good, joining</text>
  </g>
  <rect x="652" y="634" width="342" height="26" rx="3" fill="{{ground}}" stroke="{{border}}"/>
  <text x="662" y="652" font-size="13" fill="{{muted}}">Enter chat message…</text>

  <!-- status bar -->
  <line x1="622" y1="727.5" x2="1024" y2="727.5" stroke="{{border}}"/>
  <text x="638" y="753" font-size="12" fill="{{muted}}">Connected as renner (279 ms ± 0.5)</text>
  <text x="962" y="753" font-size="12" fill="{{text}}">{{VARIANT}}</text>
</svg>
